<!--
	Single-color variant for the WordPress admin menu icon (uses
	currentColor so it inherits the admin menu's icon color/hover state,
	same convention as WordPress's own Dashicons). Not wired into any menu
	yet — there is no admin page to attach it to until Phase 6-B (Field
	Group Builder). Kept here as a ready-to-use asset for whenever that
	phase adds add_menu_page()/add_submenu_page() calls, e.g.:

		add_menu_page(
			__( 'Growsfields', 'growsfields' ),
			__( 'Growsfields', 'growsfields' ),
			'manage_options',
			'growsfields',
			'the_callback',
			'data:image/svg+xml;base64,' . base64_encode(
				file_get_contents( GS_PATH . 'assets/admin-icon.svg' )
			)
		);
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
	<rect x="2" y="2" width="9" height="9" rx="1.75" fill="currentColor"/>
	<rect x="2" y="13" width="9" height="9" rx="1.75" fill="currentColor"/>
	<rect x="13" y="13" width="9" height="9" rx="1.75" fill="currentColor"/>
	<path
		fill="currentColor"
		d="M17.5,7
		   C17.5,7 13.5,7.4 13.5,3.6
		   C13.5,3.6 17.5,3.2 17.5,7
		   Z
		   M17.5,7
		   C17.5,7 21.5,7.4 21.5,3.6
		   C21.5,3.6 17.5,3.2 17.5,7
		   Z
		   M17,11 L17,7 L18,7 L18,11 Z"
	/>
</svg>
